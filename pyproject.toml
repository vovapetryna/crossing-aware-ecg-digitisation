[project]
name = "crossecg"
version = "1.0.0"
description = "Code for 'Crossing-aware auxiliary supervision for 12-lead ECG image digitisation' (ExplAI-2026)"
requires-python = ">=3.10"
dependencies = [
    "connected-components-3d>=3.12",
    "matplotlib>=3.8",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8",
    "pandas>=2",
    "scipy>=1.11",
    "timm>=1.0",
    "torch>=2.5,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crossecg"]
